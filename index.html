<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oeaki</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="mobileMenuToggle" class="mobile-menu-btn">🎨&#xFE0E;</button>

    <div class="panel ui-left">
        <div class="mode-toggles">
            <button id="modeDraw" class="active-mode" title="Рисовать">✎&#xFE0E; РИСОВАТЬ</button>
            <button id="modePan" title="Двигать (H)">✋&#xFE0E; ДВИГАТЬ</button>
        </div>
        
        <div class="row">
            <div class="range-wrapper" style="flex: 0 0 auto;">
                <label>Цвет</label>
                <input type="color" id="colorPicker" value="#000000">
            </div>

            <div class="range-wrapper">
                <label>Толщина</label>
                <input type="range" id="sizePicker" min="1" max="50" value="3">
            </div>
        </div>

        <div class="tool-grid">
            <button id="brushBtn" class="active-tool" title="Кисть (B)">🖌&#xFE0E; КИСТЬ</button>
            <button id="eraserBtn" title="Ластик (E)">▱&#xFE0E; ЛАСТИК</button>
            <button id="rectBtn" title="Квадрат (R)"><span style="font-size: 14px;">⬛&#xFE0E;</span> КВАДРАТ</button>
            <button id="circleBtn" title="Круг (C)">⭕&#xFE0E; КРУГ</button>
            <button id="lineBtn" title="Линия (L)">➖&#xFE0E; ЛИНИЯ</button>
            <button id="fillBtn" title="Заливка (F)">🪣&#xFE0E; ЗАЛИВКА</button>
            <button id="pickerBtn" title="Пипетка (I)" style="grid-column: span 2;">💉&#xFE0E; ПИПЕТКА</button>
        </div>

        <button id="undoBtn" style="background: #e0e0e0; color: #333; margin-top: 5px;" title="Отмена (Ctrl+Z)">↩&#xFE0E; ОТМЕНА</button>
        
        <!-- Кнопка сброса зума (Скрыта на ПК, появляется на телефоне) -->
        <button id="resetZoomBtn" class="mobile-only-btn" style="background: #e0e0e0; color: #333; margin-top: 5px;">🔍 ЗУМ 100%</button>
        
        <!-- Две кнопки скачивания в один ряд (Стоят ПОД зумом) -->
        <div style="display: flex; gap: 4px; margin-top: 5px; width: 100%;">
            <button id="dlScreenBtn" style="background: #e0e0e0; color: #333;" title="Скачать то, что на экране">💾 ЭКРАН</button>
            <button id="dlWorldBtn" style="background: #e0e0e0; color: #333;" title="Скачать весь холст 4000x4000">💾 ХОЛСТ</button>
        </div>
        
        <div id="statusText" class="hint-text">Зум: 100% | 0, 0</div>
    </div>

    <canvas id="board"></canvas>

    <script src="/socket.io/socket.io.js"></script>
    <script src="main.js"></script>
</body>
</html>
