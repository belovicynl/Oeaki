<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oeaki</title>
    <style>
        :root { --accent: #00E676; --panel-bg: rgba(20, 20, 20, 0.95); }
        body { margin: 0; overflow: hidden; background-color: #ffffff; transition: background-color 0.3s; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; -webkit-user-select: none; }
        
        canvas { display: block; touch-action: none; position: absolute; top: 0; left: 0; z-index: 1; cursor: crosshair;}
        
        .panel { background: var(--panel-bg); padding: 12px; border-radius: 8px; color: #ddd; position: absolute; pointer-events: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 10; backdrop-filter: blur(5px); border: 1px solid #333; }
        
        /* Уменьшенный масштаб, как просили */
        .ui-left { top: 10px; left: 10px; display: flex; flex-direction: column; gap: 10px; width: 230px; max-width: calc(100vw - 40px); }
        .ui-right { top: 10px; right: 10px; width: 170px; max-height: 50vh; overflow-y: auto; }
        .ui-bottom { bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; align-items: center; justify-content: center; width: max-content; }

        .row { display: flex; gap: 6px; align-items: center; justify-content: space-between; }
        .mode-toggles { display: flex; gap: 5px; width: 100%; }
        
        /* Кнопки */
	button { flex: 1; padding: 7px 4px; cursor: pointer; background: #333; color: #fff; border: 1px solid #444; border-radius: 6px; 	transition: all 0.2s; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; }
	button:hover { background: #444; }
	button:active { transform: scale(0.96); }

	/* Возвращаем оригинальные цвета верхним кнопкам */
	#modeDraw.active-mode { background: #1cd174; color: #000; border-color: #1cd174; font-weight: 700; }
	#modePan.active-mode { background: #333; color: #fff; border-color: #555; }

	/* Сетка для инструментов 2x2 */
	.tool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; width: 100%; }
        
        .active-tool { background: #555; border-color: #777; color: white; box-shadow: inset 0 0 5px rgba(0,0,0,0.5); }
        
        input[type="range"], input[type="color"] { cursor: pointer; }
        input[type="color"] { width: 30px; height: 30px; padding: 0; border: none; border-radius: 4px; overflow: hidden; }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: none; border-radius: 4px; }
        
        .range-wrapper { flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .range-wrapper label { font-size: 10px; color: #aaa; text-transform: uppercase; }
        input[type="range"] { width: 100%; margin: 0; }
        
        .user-item { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #333; font-size: 12px; }
        .user-item:last-child { border-bottom: none; }
        
        #zoomDisplay { min-width: 45px; text-align: center; font-family: monospace; font-size: 13px; font-weight: bold; }

        .mobile-menu-btn { display: none; position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); z-index: 20; background: #333; border: 1px solid #555; padding: 10px 20px; border-radius: 30px; color: white; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.3); font-size: 12px; cursor: pointer; }

        @media (max-width: 768px) {
            .mobile-menu-btn { display: block; }
            
            /* ЦЕНТРИРОВАНИЕ НА МОБИЛКАХ */
            .ui-left { 
                top: auto; 
                bottom: 130px; 
                left: 50%; 
                transform: translateX(-50%) scale(0.95); 
                display: none; 
            }
            .ui-left.show { display: flex; }

            .ui-right { 
                max-height: 25vh; 
                right: auto;
                left: 50%;
                transform: translateX(-50%);
                top: 10px; 
            }
            .ui-bottom { bottom: 15px; } 
        }
    </style>
</head>
<body>
    <button id="mobileMenuToggle" class="mobile-menu-btn">🎨 ИНСТРУМЕНТЫ</button>

    <div class="panel ui-left">
        <div class="mode-toggles">
    		<button id="modeDraw" class="active-mode">✎ Рисовать</button>
    		<button id="modePan">✋ Двигать</button>
	</div>

	<div class="row">
    		<div class="range-wrapper" style="flex: 0 0 auto;">
        		<label>Цвет</label>
        		<input type="color" id="colorPicker" value="#0088ff">
    	</div>
    		<div class="range-wrapper">
        	<label>Толщина</label>
        	<input type="range" id="sizePicker" min="1" max="50" value="5">
    	</div>
    </div>

<!-- ИНСТРУМЕНТЫ ТЕПЕРЬ СЕТКОЙ 2х2 -->
<div class="tool-grid">
    <button id="brushBtn" class="active-tool">Кисть</button>
    <button id="rectBtn">■ Фон</button>
    <button id="eraserBtn">Ластик</button>
    <button id="pickerBtn">Пипетка</button>
</div>

        <div class="row">
            <div class="range-wrapper">
                <label>Цвет холста</label>
                <input type="color" id="bgColorPicker" value="#ffffff" style="width: 100%; height: 20px;">
            </div>
        </div>

        <button id="downloadBtn" style="background: #2a2a2a; margin-top: 5px;">📷 Скачать холст</button>
    </div>

    <div class="panel ui-right">
        <div id="onlineCounter" style="font-weight: bold; margin-bottom: 10px; color: #00E676; font-size: 13px;">Онлайн: 1</div>
        <div class="user-item" style="border-bottom: 2px solid #555; padding-bottom: 8px; margin-bottom: 5px;">
            <input type="checkbox" id="hideOthersGlobal">
            <label style="color: #ffaa00; font-weight: bold;">Скрыть чужое</label>
        </div>
        <div style="font-size: 10px; color: #aaa; margin-bottom: 5px;">Галочка = видно:</div>
        <div id="usersList"></div>
    </div>

    <div class="panel ui-bottom">
        <button id="zoomOut">➖</button>
        <span id="zoomDisplay">100%</span>
        <button id="zoomIn">➕</button>
        <button id="zoomReset" style="margin-left: 10px;">Сброс</button>
    </div>

    <canvas id="board"></canvas>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const canvas = document.getElementById('board');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        // === ПЕРЕМЕННЫЕ ===
        let redrawPending = false; 
        let myId = null;
        let mode = 'draw'; 
        let currentTool = 'brush'; // 'brush', 'rect', 'eraser', 'picker'
        
        let myColor = "#0088ff";
        let mySize = 5;
        let currentBgColor = "#ffffff";
        let hideOthersGlobal = false;
        let hiddenUsers = new Set(); 

        let myStrokes = [];
        let othersStrokes = [];
        let otherCursors = {}; 

        let camera = { x: window.innerWidth / 2, y: window.innerHeight / 2, zoom: 1 };
        let isPanning = false;
        let isDrawing = false;
        let panStart = { x: 0, y: 0 };
        let currentStroke = { type: 'brush', points: [] };
        
        let lastCursorSend = 0;

        // === БАЗОВЫЕ ФУНКЦИИ ===
        function getWorldPos(screenX, screenY) {
            return {
                x: (screenX - camera.x) / camera.zoom,
                y: (screenY - camera.y) / camera.zoom
            };
        }

        function requestRedraw() {
            if (!redrawPending) {
                redrawPending = true;
                requestAnimationFrame(renderCore);
            }
        }

        // Рендер инструмента (кисть или залитый прямоугольник)
        function drawShape(context, stroke) {
            if (stroke.points.length < 2) return;
            
            context.globalCompositeOperation = stroke.isEraser ? 'destination-out' : 'source-over';
            context.fillStyle = stroke.color;
            context.strokeStyle = stroke.isEraser ? 'rgba(0,0,0,1)' : stroke.color;
            context.lineWidth = stroke.size;
            context.lineCap = 'round';
            context.lineJoin = 'round';

            if (stroke.type === 'rect') {
                const start = stroke.points[0];
                const end = stroke.points[stroke.points.length - 1];
                const width = end.x - start.x;
                const height = end.y - start.y;
                context.beginPath();
                context.rect(start.x, start.y, width, height);
                context.fill();
            } else {
                context.beginPath();
                context.moveTo(stroke.points[0].x, stroke.points[0].y);
                for (let i = 1; i < stroke.points.length; i++) {
                    context.lineTo(stroke.points[i].x, stroke.points[i].y);
                }
                context.stroke();
            }
            context.globalCompositeOperation = 'source-over';
        }

        function renderCore() {
            ctx.clearRect(0, 0, canvas.width, canvas.height); 
            ctx.save();
            ctx.translate(camera.x, camera.y);
            ctx.scale(camera.zoom, camera.zoom);

            // 1. Рисуем чужие линии (если не скрыты)
            if (!hideOthersGlobal) {
                othersStrokes.forEach(stroke => {
                    if (stroke.userId !== myId && !hiddenUsers.has(stroke.userId)) {
                        drawShape(ctx, stroke);
                    }
                });
            }

            // 2. УМНЫЙ ЛАСТИК: Рисуем свои линии на отдельном скрытом холсте
            // Это позволяет стирать только свои векторы, не прорезая чужие!
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvas.width; tempCanvas.height = canvas.height;
            const tCtx = tempCanvas.getContext('2d');
            
            tCtx.save();
            tCtx.translate(camera.x, camera.y);
            tCtx.scale(camera.zoom, camera.zoom);
            
            myStrokes.forEach(stroke => drawShape(tCtx, stroke));
            
            if (currentStroke.points.length > 0) {
                drawShape(tCtx, currentStroke);
            }
            tCtx.restore();

            // Копируем наш "личный" слой поверх чужого на главный холст
            ctx.restore(); // Сбрасываем трансформации перед отрисовкой пикселей холста
            ctx.drawImage(tempCanvas, 0, 0);

            // 3. Рисуем курсоры
            ctx.save();
            ctx.translate(camera.x, camera.y);
            ctx.scale(camera.zoom, camera.zoom);
            if (!hideOthersGlobal) {
                for (let id in otherCursors) {
                    if (hiddenUsers.has(id) || id === myId) continue; 
                    const c = otherCursors[id];
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, 5 / camera.zoom, 0, Math.PI * 2);
                    ctx.fillStyle = c.color;
                    ctx.fill();
                }
            }
            ctx.restore();

            redrawPending = false;
        }

        function updateZoomDisplay() {
            document.getElementById('zoomDisplay').innerText = Math.round(camera.zoom * 100) + '%';
        }

        // === СОКЕТЫ ===
        socket.on('init_canvas', (data) => { 
            myId = data.myId; // Получаем наш IP-based ID
            
            // Сортируем: где мы, а где чужие
            othersStrokes = [];
            myStrokes = [];
            data.strokes.forEach(s => {
                if(s.userId === myId) myStrokes.push(s);
                else othersStrokes.push(s);
            });
            requestRedraw(); 
        });
        
        socket.on('new_stroke', (stroke) => { othersStrokes.push(stroke); requestRedraw(); });
        socket.on('wipe_canvas', () => { myStrokes = []; othersStrokes = []; requestRedraw(); });
        socket.on('cursor_update', (data) => { otherCursors[data.id] = data; requestRedraw(); });
        socket.on('cursor_remove', (id) => { delete otherCursors[id]; requestRedraw(); });

        socket.on('update_users', (users) => {
            const listDiv = document.getElementById('usersList');
            if(!listDiv) return;
            listDiv.innerHTML = '';
            let count = 0;

            for (let id in users) {
                count++;
                if (id === myId) continue; 

                const div = document.createElement('div');
                div.className = 'user-item';
                
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = !hiddenUsers.has(id); 
                
                checkbox.addEventListener('change', (e) => {
                    if (e.target.checked) hiddenUsers.delete(id);
                    else hiddenUsers.add(id);
                    requestRedraw(); 
                });

                const label = document.createElement('label');
                label.innerText = 'Игрок ' + id; 

                div.appendChild(checkbox);
                div.appendChild(label);
                listDiv.appendChild(div);
            }
            document.getElementById('onlineCounter').innerText = `Онлайн: ${count}`;
        });

        // === ПИПЕТКА ===
        function pickColor(clientX, clientY) {
            // Пипетка берет цвет прямо с экрана (с учетом фона body)
            const pixelData = ctx.getImageData(clientX, clientY, 1, 1).data;
            if(pixelData[3] === 0) {
                document.getElementById('colorPicker').value = currentBgColor;
                myColor = currentBgColor;
            } else {
                const hex = "#" + ("000000" + rgbToHex(pixelData[0], pixelData[1], pixelData[2])).slice(-6);
                document.getElementById('colorPicker').value = hex;
                myColor = hex;
            }
            // Автоматически возвращаемся на кисть
            setTool('brush');
        }

        function rgbToHex(r, g, b) {
            return (r << 16) | (g << 8) | b;
        }


        // === УПРАВЛЕНИЕ ===
        function handleStart(clientX, clientY, isTouch, e) {
            if (mode === 'pan' || (!isTouch && e.button === 1) || (isTouch && e.touches && e.touches.length > 1)) {
                isPanning = true;
                panStart = { x: clientX - camera.x, y: clientY - camera.y };
                canvas.style.cursor = 'grabbing';
            } 
            else if (mode === 'draw' && (isTouch || e.button === 0)) {
                if (currentTool === 'picker') {
                    pickColor(clientX, clientY);
                    return;
                }

                isDrawing = true;
                const worldPos = getWorldPos(clientX, clientY);
                currentStroke = { 
                    type: currentTool === 'rect' ? 'rect' : 'brush', 
                    points: [worldPos], 
                    color: myColor, 
                    size: mySize, 
                    isEraser: currentTool === 'eraser' 
                };
            }
        }

        function handleMove(clientX, clientY, e) {
            if (isPanning) {
                camera.x = clientX - panStart.x;
                camera.y = clientY - panStart.y;
                requestRedraw();
                return;
            }

            if(e.target === canvas) {
                const worldPos = getWorldPos(clientX, clientY);
                const now = Date.now();
                if (now - lastCursorSend > 30) {
                    socket.emit('cursor_move', { x: worldPos.x, y: worldPos.y, color: currentTool === 'eraser' ? '#aaaaaa' : myColor });
                    lastCursorSend = now;
                }

                if (isDrawing) {
                    currentStroke.points.push(worldPos);
                    requestRedraw();
                }
            }
        }

        function handleEnd() {
            if (isPanning) {
                isPanning = false;
                canvas.style.cursor = mode === 'pan' ? 'grab' : 'crosshair';
            }
            if (isDrawing && currentStroke.points.length > 1) {
                // Оптимизация для прямоугольника (сохраняем только 2 точки)
                if(currentStroke.type === 'rect') {
                    currentStroke.points = [currentStroke.points[0], currentStroke.points[currentStroke.points.length-1]];
                }
                myStrokes.push(JSON.parse(JSON.stringify(currentStroke)));
                socket.emit('draw_stroke', currentStroke); 
            }
            isDrawing = false;
            currentStroke.points = [];
            requestRedraw();
        }

        canvas.addEventListener('mousedown', (e) => handleStart(e.clientX, e.clientY, false, e));
        window.addEventListener('mousemove', (e) => handleMove(e.clientX, e.clientY, e));
        window.addEventListener('mouseup', handleEnd);

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault(); 
            handleStart(e.touches[0].clientX, e.touches[0].clientY, true, e);
        }, { passive: false });
        
        window.addEventListener('touchmove', (e) => {
            if(e.target === canvas) e.preventDefault();
            handleMove(e.touches[0].clientX, e.touches[0].clientY, e);
        }, { passive: false });
        
        window.addEventListener('touchend', handleEnd);

        canvas.addEventListener('wheel', (e) => {
            const zoomSpeed = 0.1;
            const worldPosBefore = getWorldPos(e.clientX, e.clientY);
            
            if (e.deltaY < 0) camera.zoom *= (1 + zoomSpeed);
            else camera.zoom /= (1 + zoomSpeed);
            
            camera.zoom = Math.min(Math.max(0.1, camera.zoom), 10);
            updateZoomDisplay();
            
            const worldPosAfter = getWorldPos(e.clientX, e.clientY);
            camera.x += (worldPosAfter.x - worldPosBefore.x) * camera.zoom;
            camera.y += (worldPosAfter.y - worldPosBefore.y) * camera.zoom;
            
            requestRedraw();
        });

        // === ИНТЕРФЕЙС ===
        document.getElementById('mobileMenuToggle').addEventListener('click', (e) => {
            const panel = document.querySelector('.ui-left');
            panel.classList.toggle('show');
            if(panel.classList.contains('show')) {
                e.target.innerText = '❌ ЗАКРЫТЬ';
                e.target.style.background = '#ff4444';
            } else {
                e.target.innerText = '🎨 ИНСТРУМЕНТЫ';
                e.target.style.background = '#333';
            }
        });

        document.getElementById('modeDraw').addEventListener('click', (e) => {
            mode = 'draw';
            e.target.classList.add('active-mode');
            document.getElementById('modePan').classList.remove('active-mode');
            canvas.style.cursor = currentTool === 'picker' ? 'crosshair' : 'crosshair';
        });

        document.getElementById('modePan').addEventListener('click', (e) => {
            mode = 'pan';
            e.target.classList.add('active-mode');
            document.getElementById('modeDraw').classList.remove('active-mode');
            canvas.style.cursor = 'grab';
        });

        // Переключатель инструментов
        const toolBtns = {
            'brush': document.getElementById('brushBtn'),
            'rect': document.getElementById('rectBtn'),
            'eraser': document.getElementById('eraserBtn'),
            'picker': document.getElementById('pickerBtn')
        };

        function setTool(newTool) {
            currentTool = newTool;
            for(let key in toolBtns) toolBtns[key].classList.remove('active-tool');
            toolBtns[newTool].classList.add('active-tool');
            
            if(mode === 'draw') {
                canvas.style.cursor = newTool === 'picker' ? 'crosshair' : 'crosshair'; // Можно задать 'url(cursor.png), auto'
            }
        }

        toolBtns['brush'].addEventListener('click', () => setTool('brush'));
        toolBtns['rect'].addEventListener('click', () => setTool('rect'));
        toolBtns['eraser'].addEventListener('click', () => setTool('eraser'));
        toolBtns['picker'].addEventListener('click', () => setTool('picker'));


        document.getElementById('colorPicker').addEventListener('input', (e) => { 
            myColor = e.target.value; 
            if(currentTool === 'eraser' || currentTool === 'picker') setTool('brush');
        });
        
        document.getElementById('bgColorPicker').addEventListener('input', (e) => { 
            currentBgColor = e.target.value; 
            document.body.style.backgroundColor = currentBgColor; 
        });

        document.getElementById('sizePicker').addEventListener('input', (e) => { mySize = e.target.value; });
        
        document.getElementById('hideOthersGlobal').addEventListener('change', (e) => {
            hideOthersGlobal = e.target.checked;
            requestRedraw();
        });

        document.getElementById('zoomIn').addEventListener('click', () => { camera.zoom = Math.min(camera.zoom * 1.5, 10); updateZoomDisplay(); requestRedraw(); });
        document.getElementById('zoomOut').addEventListener('click', () => { camera.zoom = Math.max(camera.zoom / 1.5, 0.1); updateZoomDisplay(); requestRedraw(); });
        document.getElementById('zoomReset').addEventListener('click', () => { camera.zoom = 1; camera.x = window.innerWidth / 2; camera.y = window.innerHeight / 2; updateZoomDisplay(); requestRedraw(); });

        document.getElementById('downloadBtn').addEventListener('click', () => {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            const tCtx = tempCanvas.getContext('2d');
            
            tCtx.fillStyle = currentBgColor;
            tCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
            tCtx.drawImage(canvas, 0, 0);

            const link = document.createElement('a');
            link.download = 'Oeaki_Art.jpg';
            link.href = tempCanvas.toDataURL('image/jpeg', 0.9);
            link.click();
        });

        // === ИНИЦИАЛИЗАЦИЯ ===
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            requestRedraw();
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas(); 
    </script>
</body>
</html>
